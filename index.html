<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Edpuzzle speed adjuster</title>
        <link rel="stylesheet" href="https://use.typekit.net/brf0pbc.css">
        <link rel="stylesheet" href="css/index.css">
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Speed</h1>
        <p><span id="speed">1</span>x</p>
        <label for="frame">Frame</label>
        <input type="text" placeholder="Frame Id" id="frame" class="text">
        <button id="type">Id</button>
        <label for="slide">Speed</label>
        <input type="range" min="0.25" max="16" value="1" step="0.25" id="slide" class="slide">
        <script src="index.js"></script>
    </body>
</html>
